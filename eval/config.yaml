# 評価プログラムの設定

# 比較する2つのモデル名（outputs.jsonl の "model" と一致させる）
compare:
  base: base      # 未学習モデル
  target: lora    # QLoRA 追加学習済みモデル

# 指標3：形式遵守率
format:
  speakers: [A, B]          # 許可する話者ラベル
  min_turns: 4              # 最低ターン数（発話の数）※要相談
  require_alternation: true # A と B が交互に話すこと
  first_speaker: null       # 例: A にすると「A から始まる」も条件に入る

# 日本語判定（形式遵守率とは別に集計）
# ja_ratio = 日本語の文字数 ÷（日本語の文字数＋英単語の数）。話者ラベルは除いて数える
japanese:
  pass_ratio: 0.9           # これ以上で、かなを含めば「合格」
  fail_ratio: 0.5           # これ未満は「不合格」。間は「要確認」（人が確認する）
  # 英単語として数えない略語（大文字小文字を区別）。ここにない英単語はすべて数える
  allowed_abbreviations: [URL, PDF, AI, IT, OK, PC, SNS, TV, CM, ID, QR, NHK, JR, GDP]

# 指標1：BERTScore
bertscore:
  model_type: cl-tohoku/bert-base-japanese-v3
  num_layers: 9             # 使う隠れ層（12層中9層目）
  batch_size: 16
  device: auto              # auto / cuda / cpu

# 指標2：人的評価
human_eval:
  # 評価基準の版。項目や定義を変えたら上げる（版の違うシートは混ぜて集計できない）
  criteria_version: 2
  criteria: [日本語会話としての自然さ, 内容の正確性, 情報の網羅性, 対話の一貫性]
  scale: 5                  # 1〜5 の5段階（2・4 は中間）
  seed: 42                  # 提示順シャッフルの乱数シード
  unable_label: 評価不能     # 点数の代わりに記入できる語。未記入とは区別して集計する
  unable_reasons: [空出力, 言語のため判断できない, その他（コメントに記入）]
  descriptions:
    日本語会話としての自然さ: "想定する日本語の日常会話として自然か。英文のみの出力は日本語条件を満たさない。丁寧語であること自体は減点しない。"
    内容の正確性: "入力の事実・数値・対象・条件を変えていないか。入力にない事実を断定していないか。欠落はここでは減点せず、情報の網羅性で評価する。"
    情報の網羅性: "入力の重要な情報が含まれているか。言い換えは許容する。"
    対話の一貫性: "発話の流れ、対話内の矛盾、不自然な会話の再開始や役割の変化を評価する。A が説明すること自体は減点しない。"
  anchors:                  # 説明シートに載せる 1・3・5 点の目安
    日本語会話としての自然さ:
      5: 日本語の日常会話として違和感がなく、言い回しや相槌も自然
      3: 意味は通じるが、翻訳調・書き言葉のまま・不自然な言い回しが目立つ
      1: 日本語の会話として成り立っていない（英文のみ・意味が通じない・会話になっていない等）
    内容の正確性:
      5: 事実・数値・対象・条件の誤りがなく、入力にない事実の断定もない
      3: 軽い誤りや入力にない事実の断定が一部にあるが、主要な内容は正しい
      1: 主要な事実・数値・対象・条件に誤りがある、または入力にない事実の断定が多い
    情報の網羅性:
      5: 入力の重要な情報がほぼすべて含まれている
      3: 入力の重要な情報の半分程度が含まれている
      1: 入力の重要な情報がほとんど含まれていない
    対話の一貫性:
      5: 流れが自然で、矛盾・不自然な再開始・不自然な役割の変化がない
      3: 不自然な再開始や役割の変化、小さな矛盾が一部にある
      1: 矛盾・再開始・役割の変化が多く、対話としてまとまっていない
  rules:                    # 説明シートに載せる、特別な場合の扱い
    - "空出力（評価対象の欄が空、または raw で全分割が空）: 自然さ・網羅性・一貫性は 1。正確性は「評価不能」とし、理由に「空出力」を選ぶ（述べている内容がないため。欠落は網羅性で評価する）。"
    - "raw で一部の分割だけが空の場合: その分割の内容がないものとして、網羅性などで通常どおり評価する。"
    - "英語など日本語以外の出力: 自然さは 1（日本語条件を満たさない）。内容が読み取れる項目は通常どおり採点する。言語のために判断できない項目だけ「評価不能」とし、理由に「言語のため判断できない」を選ぶ。"
    - "「評価不能」と書いたら、必ず「評価不能の理由」を選ぶ。未記入のままの欄は「未記入」として、評価不能とは別に数える。"
